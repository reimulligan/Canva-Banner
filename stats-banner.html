  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  .marquee { display:flex; align-items:center; height:100%; box-sizing:border-box; padding:var(--pad) 0; overflow:hidden; background:var(--bg); }
  .track { height:var(--h); width:calc(100vw + var(--tile-w) * 2);  /* always wider than the screen, so it never runs out */
